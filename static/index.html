<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safarnama - Travel Intelligence Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); }
        #map { height: 400px; border-radius: 20px; }
        .hero-gradient { background: linear-gradient(135deg, #1e293b 0%, #334155 100%); }
    </style>
</head>
<body class="text-slate-900">
    <!-- Navbar -->
    <nav class="sticky top-0 z-50 glass px-6 py-4 flex justify-between items-center">
        <div class="text-2xl font-bold tracking-tight text-indigo-600 flex items-center gap-2">
            <span class="text-3xl">🗺️</span> Safarnama
        </div>
        <div class="hidden md:flex gap-8 font-semibold text-slate-600">
            <a href="#" class="hover:text-indigo-600 transition">Discovery Engine</a>
            <a href="#" class="hover:text-indigo-600 transition">Intelligence Graph</a>
        </div>
        <button class="bg-indigo-600 text-white px-5 py-2 rounded-full font-bold">Sign In</button>
    </nav>

    <!-- Hero -->
    <section class="hero-gradient text-white pt-20 pb-32 px-6 text-center">
        <h1 class="text-4xl md:text-5xl font-extrabold mb-6 leading-tight">India's <span class="text-indigo-400">Intelligence-Powered</span> Discovery.</h1>
        <p class="text-lg text-slate-300 mb-10 max-w-2xl mx-auto">Ranked recommendations backed by our travel knowledge graph.</p>
        
        <!-- Contextual Filter -->
        <div class="max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-4 bg-white p-4 rounded-3xl shadow-2xl">
            <select id="season-filter" class="bg-slate-50 p-4 rounded-2xl text-slate-700 font-bold focus:outline-none">
                <option value="monsoon">Monsoon Vibe</option>
                <option value="winter">Winter Chill</option>
                <option value="summer">Summer Escape</option>
            </select>
            <select id="interest-filter" class="bg-slate-50 p-4 rounded-2xl text-slate-700 font-bold focus:outline-none">
                <option value="photography">Photography</option>
                <option value="adventure">Adventure</option>
                <option value="relaxation">Relaxation</option>
            </select>
            <button onclick="fetchRankedPlaces()" class="bg-indigo-600 text-white rounded-2xl font-bold hover:bg-indigo-700 transition">Analyze & Rank</button>
        </div>
    </section>

    <!-- Results -->
    <main class="max-w-7xl mx-auto -mt-16 px-6">
        <div id="map" class="mb-16 shadow-2xl"></div>
        <div id="discovery-sections" class="pb-20"></div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map', { scrollWheelZoom: false }).setView([22.5937, 78.9629], 5);
        L.tileLayer('https://{s}.tile.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);

        async function trackEvent(type, payload = {}) {
            try {
                await fetch('/api/v1/analytics/event', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ event_type: type, payload })
                });
            } catch (e) { console.warn("Analytics error", e); }
        }

        async function fetchRankedPlaces() {
            const season = document.getElementById('season-filter').value;
            const interest = document.getElementById('interest-filter').value;
            
            trackEvent('search', { season, interest });
            
            const res = await fetch(`/api/v1/places/?season=${season}&interest=${interest}`);
            const data = await res.json();
            renderRankedResults(data.items);
        }

        function renderRankedResults(items) {
            const container = document.getElementById('discovery-sections');
            
            if (items.length === 0) {
                trackEvent('no_results', { query: 'filter_active' });
                container.innerHTML = `<div class="text-center p-20 text-slate-400 font-bold">No results found for your criteria.</div>`;
                return;
            }

            container.innerHTML = `
                <div class="mb-10">
                    <h2 class="text-3xl font-extrabold text-slate-800 mb-2">Ranked Recommendations</h2>
                    <p class="text-slate-500">Intelligence-powered discovery with explainable scoring.</p>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                    ${items.map(item => renderRankedCard(item)).join('')}
                </div>
            `;
            
            // Add markers
            items.forEach(item => {
                const p = item.place;
                const marker = L.marker([p.latitude, p.longitude]).addTo(map);
                marker.bindPopup(`<b>${p.name}</b><br>Score: ${Math.round(item.total_score * 100)}%`);
            });
        }

        function renderRankedCard(item) {
            const place = item.place;
            const heroImg = place.hero_image || 'https://images.unsplash.com/photo-1506461883276-594a12b11cf3?w=800';
            return `
                <div class="bg-white rounded-3xl overflow-hidden shadow-sm hover:shadow-xl transition-all group border border-slate-100" 
                     onclick="trackEvent('click', { place_id: '${place.id}', score: ${item.total_score} })">
                    <div class="h-48 overflow-hidden relative">
                        <img src="${heroImg}" class="w-full h-full object-cover">
                        <div class="absolute top-4 right-4 bg-indigo-600 text-white px-3 py-1 rounded-full text-xs font-bold shadow-lg">
                            Score: ${Math.round(item.total_score * 100)}%
                        </div>
                    </div>
                    <div class="p-6">
                        <div class="flex justify-between items-start mb-1">
                            <h3 class="text-xl font-bold text-slate-800">${place.name}</h3>
                            <div class="flex flex-col items-end">
                                <span class="text-[10px] font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-full">
                                    Trust: ${Math.round(place.trust_signal.confidence * 100)}%
                                </span>
                            </div>
                        </div>
                        <div class="text-[10px] text-slate-400 font-semibold mb-3 uppercase tracking-widest">Source: ${place.trust_signal.source || 'Verified Partner'}</div>
                        
                        <div class="space-y-2 mb-4">
                            ${item.reasons.map(reason => `
                                <div class="flex items-center gap-2 text-sm text-indigo-600 font-medium bg-indigo-50/50 px-3 py-1.5 rounded-xl border border-indigo-100/50">
                                    <span>✨</span> ${reason}
                                </div>
                            `).join('')}
                        </div>
                        <p class="text-slate-500 text-sm line-clamp-2">${place.description}</p>
                        
                        <button onclick="event.stopPropagation(); trackEvent('bookmark_intent', { place_id: '${place.id}' })" 
                                class="mt-6 w-full py-3 bg-slate-50 hover:bg-slate-100 text-slate-600 font-bold rounded-2xl transition">
                            Bookmark
                        </button>
                    </div>
                </div>
            `;
        }

        fetchRankedPlaces();
    </script>
</body>
</html>
