<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safarnama - India's Offbeat Discovery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        #map { height: 400px; border-radius: 20px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .hero-gradient { background: linear-gradient(135deg, #1e293b 0%, #334155 100%); }
    </style>
</head>
<body class="text-slate-900">
    <!-- Navbar -->
    <nav class="sticky top-0 z-50 glass px-6 py-4 flex justify-between items-center">
        <div class="text-2xl font-bold tracking-tight text-indigo-600 flex items-center gap-2">
            <span class="text-3xl">🗺️</span> Safarnama
        </div>
        <div class="hidden md:flex gap-8 font-semibold text-slate-600">
            <a href="#" class="hover:text-indigo-600 transition">Discover</a>
            <a href="#" class="hover:text-indigo-600 transition">Hidden Gems</a>
            <a href="#" class="hover:text-indigo-600 transition">Road Trips</a>
        </div>
        <button class="bg-indigo-600 text-white px-5 py-2 rounded-full font-bold hover:bg-indigo-700 transition">Sign In</button>
    </nav>

    <!-- Hero Section -->
    <section class="hero-gradient text-white pt-20 pb-32 px-6 text-center">
        <h1 class="text-4xl md:text-6xl font-extrabold mb-6 leading-tight">Discover India's <span class="text-indigo-400">Hidden</span> Reality.</h1>
        <p class="text-lg md:text-xl text-slate-300 mb-10 max-w-2xl mx-auto">Explore secret waterfalls, forgotten valleys, and pristine trails tourists usually miss.</p>
        
        <!-- Search Bar -->
        <div class="max-w-3xl mx-auto relative group">
            <input type="text" placeholder="Search unknown waterfalls near me..." 
                   class="w-full py-5 px-8 rounded-2xl text-slate-900 focus:outline-none focus:ring-4 focus:ring-indigo-500/50 shadow-2xl text-lg transition-all">
            <button class="absolute right-3 top-3 bg-indigo-600 text-white px-8 py-2 rounded-xl font-bold hover:bg-indigo-700 transition">Explore</button>
        </div>
    </section>

    <!-- Discovery Dashboard -->
    <main class="max-w-7xl mx-auto -mt-16 px-6">
        <div id="map" class="mb-16"></div>

        <!-- Collections -->
        <div id="discovery-sections" class="space-y-16 pb-20">
            <!-- Loading States -->
            <div class="animate-pulse space-y-4">
                <div class="h-8 bg-slate-200 rounded w-48"></div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="h-64 bg-slate-200 rounded-2xl"></div>
                    <div class="h-64 bg-slate-200 rounded-2xl"></div>
                    <div class="h-64 bg-slate-200 rounded-2xl"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- Detailed View Modal (Simplified) -->
    <div id="detail-modal" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-6 bg-slate-900/60 backdrop-blur-sm">
        <div class="bg-white w-full max-w-4xl max-height-[90vh] rounded-3xl overflow-hidden shadow-2xl relative overflow-y-auto">
            <button onclick="closeModal()" class="absolute right-6 top-6 text-white bg-slate-900/50 p-2 rounded-full hover:bg-slate-900 transition">✕</button>
            <div id="modal-content"></div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map', { scrollWheelZoom: false }).setView([22.5937, 78.9629], 5);
        L.tileLayer('https://{s}.tile.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap contributors &copy; CARTO'
        }).addTo(map);

        async function init() {
            try {
                const response = await fetch('/api/v1/places/discovery');
                const data = await response.json();
                renderDiscovery(data);
            } catch (e) {
                console.error("Failed to load discovery data", e);
            }
        }

        function renderDiscovery(collections) {
            const container = document.getElementById('discovery-sections');
            container.innerHTML = '';

            for (const [title, places] of Object.entries(collections)) {
                if (places.length === 0) continue;

                const section = document.createElement('div');
                section.innerHTML = `
                    <div class="flex justify-between items-end mb-6">
                        <h2 class="text-2xl font-extrabold text-slate-800">${title}</h2>
                        <a href="#" class="text-indigo-600 font-bold hover:underline">View all</a>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                        ${places.map(place => renderPlaceCard(place)).join('')}
                    </div>
                `;
                container.appendChild(section);
                
                // Add markers
                places.forEach(place => {
                    const marker = L.marker([place.latitude, place.longitude]).addTo(map);
                    marker.bindPopup(`<b>${place.name}</b><br>${place.city}, ${place.state}`);
                });
            }
        }

        function renderPlaceCard(place) {
            const heroImg = place.hero_image || 'https://images.unsplash.com/photo-1506461883276-594a12b11cf3?auto=format&fit=crop&q=80&w=800';
            return `
                <div class="bg-white rounded-3xl overflow-hidden shadow-sm hover:shadow-xl transition-all cursor-pointer group" onclick='openPlace("${place.id}")'>
                    <div class="h-48 overflow-hidden relative">
                        <img src="${heroImg}" class="w-full h-full object-cover group-hover:scale-110 transition duration-500">
                        <div class="absolute top-4 left-4 bg-white/90 backdrop-blur px-3 py-1 rounded-full text-xs font-bold text-indigo-600 uppercase tracking-wider">
                            ${place.category}
                        </div>
                    </div>
                    <div class="p-6">
                        <div class="flex justify-between items-start mb-2">
                            <h3 class="text-xl font-bold text-slate-800">${place.name}</h3>
                            <span class="text-sm font-bold text-green-600">${place.budget || 'Budget'}</span>
                        </div>
                        <p class="text-slate-500 text-sm mb-4 line-clamp-2">${place.description}</p>
                        <div class="flex flex-wrap gap-2">
                            ${place.tags.map(tag => `<span class="text-[10px] font-bold bg-slate-100 px-2 py-1 rounded-md text-slate-500 uppercase">${tag}</span>`).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        async function openPlace(id) {
            const res = await fetch(`/api/v1/places/${id}`);
            const place = await res.json();
            
            const modal = document.getElementById('detail-modal');
            const content = document.getElementById('modal-content');
            
            content.innerHTML = `
                <div class="h-80 w-full relative">
                    <img src="${place.hero_image || 'https://images.unsplash.com/photo-1506461883276-594a12b11cf3?w=1200'}" class="w-full h-full object-cover">
                    <div class="absolute bottom-0 left-0 right-0 p-10 bg-gradient-to-t from-slate-900/80 to-transparent text-white">
                        <h2 class="text-4xl font-extrabold mb-2">${place.name}</h2>
                        <p class="text-lg opacity-90">${place.city}, ${place.state}</p>
                    </div>
                </div>
                <div class="p-10 grid grid-cols-1 md:grid-cols-3 gap-10">
                    <div class="md:col-span-2">
                        <h4 class="text-2xl font-bold mb-4">The Experience</h4>
                        <p class="text-slate-600 leading-relaxed text-lg mb-8">${place.description}</p>
                        
                        <div class="grid grid-cols-2 gap-4">
                            <div class="bg-indigo-50 p-4 rounded-2xl">
                                <span class="block text-xs font-bold text-indigo-400 uppercase mb-1">Best Time</span>
                                <span class="font-bold text-slate-700">${place.best_time}</span>
                            </div>
                            <div class="bg-indigo-50 p-4 rounded-2xl">
                                <span class="block text-xs font-bold text-indigo-400 uppercase mb-1">Crowd Level</span>
                                <span class="font-bold text-slate-700">${place.crowd_factor}/5</span>
                            </div>
                        </div>
                    </div>
                    <div class="bg-slate-50 p-6 rounded-3xl">
                        <h4 class="font-bold text-lg mb-4">Nearby Nodes</h4>
                        <div class="space-y-4">
                            ${place.relationships.map(rel => `
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 bg-white rounded-full flex items-center justify-center shadow-sm">📍</div>
                                    <div>
                                        <div class="font-bold text-sm text-slate-800">${rel.target_name}</div>
                                        <div class="text-[10px] text-slate-400 uppercase font-bold">${rel.type.replace('_', ' ')}</div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
            
            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('detail-modal').classList.add('hidden');
        }

        init();
    </script>
</body>
</html>
